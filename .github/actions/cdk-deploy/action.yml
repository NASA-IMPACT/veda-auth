name: Deploy

inputs:
  env_aws_secret_name:
    required: true
    type: string
  dir:
    required: false
    type: string
    default: "."
  script_path:
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Install node and related deps
      uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e4 #v4.3.0
      with:
        node-version: 20

    - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf #v4.2.2
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

    - name: Install AWS CDK
      shell: bash
      run: npm install -g aws-cdk@2

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.10"
        cache: "pip"
        cache-dependency-path: |
          ${{ inputs.dir }}/requirements.txt

    - name: Install python dependencies
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        pip install \
          -r requirements.txt \

    - name: Get relevant environment configuration from aws secrets
      shell: bash
      working-directory: ${{ inputs.dir }}
      env:
        AWS_DEFAULT_REGION: us-west-2
      run: |
        if [[ -z "${{ inputs.script_path }}" ]]; then
        ./scripts/sync-env.sh ${{ inputs.env_aws_secret_name }}
        else
        python ${{ inputs.script_path }} --secret-id ${{ inputs.env_aws_secret_name }}
        fi

    - name: Deploy
      id: deploy_auth_stack
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        cdk deploy --all --require-approval never --outputs-file ${HOME}/cdk-outputs.json
